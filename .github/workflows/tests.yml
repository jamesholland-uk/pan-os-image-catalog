name: Tests
# Only code changes: the checkers push a data commit to main several times a
# day, and those need no testing.
on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "scripts/requirements.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "**.py"
      - "scripts/requirements.txt"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

jobs:
  unittest:
    permissions:
      contents: read
    name: "unittest"

    runs-on: "ubuntu-latest"

    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - uses: "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0" # v7.1.0
        with:
          python-version: "3.15.1"

      # The tests cover the parsers and output handling only, which use the
      # standard library, so no requirements need installing.
      - name: Run tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v
